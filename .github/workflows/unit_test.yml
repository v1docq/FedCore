name: Offline CPU tests

on:
  push:
    branches: [main, fedcore_refactoring, fedcore_petra_experiments]
  pull_request:
    branches: [main, fedcore_refactoring]
  workflow_dispatch:

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11']
    runs-on: ${{ matrix.os }}
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU runtime and package test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.0 torchvision==0.17.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test,experiments]"
          python -m pip check
      - name: Collect autonomous CPU suite
        run: python -m pytest --collect-only -q tests/refactoring tests/petra tests/unit/algorithm/low_rank tests/unit/low_rank/test_statistical_profiles.py tests/unit/low_rank/test_statistical_collectors.py
      - name: Run autonomous CPU suite
        run: python -m pytest -q tests/refactoring tests/petra tests/unit/algorithm/low_rank tests/unit/low_rank/test_statistical_profiles.py tests/unit/low_rank/test_statistical_collectors.py
      - name: Check examples and archives for published credentials
        run: python scripts/check_example_secrets.py examples
      - name: Build wheel and sdist
        run: python -m build
      - name: Verify installed artifacts outside checkout
        run: python -m pytest -q tests/refactoring/test_core_packaging.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributions-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*

  optional-export-service:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install CPU runtime and optional format/service dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.0 torchvision==0.17.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test,export,service,experiments]"
          python -m pip check
      - name: Run CPU regressions with actual export and service integrations
        run: python -m pytest -q tests/refactoring tests/petra tests/unit/algorithm/low_rank tests/unit/low_rank/test_statistical_profiles.py tests/unit/low_rank/test_statistical_collectors.py
