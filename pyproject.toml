[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedcore"
dynamic = ["version"]
description = "Framework for neural network compression and automation"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "BSD 3-Clause" }
authors = [{ name = "FedCore team" }]
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "fedot==0.7.5",
  "numpy==1.26.4",
  "pandas>=1.5,<3",
  "scipy==1.11.4",
  "scikit-learn>=1.3,<1.6",
  "torch==2.2.0",
  "torchvision==0.17.0",
  "torch-pruning==1.5.2",
  "torchmetrics==1.4.3",
  "torchinfo==1.8.0",
  "tensorly==0.8.1",
  "tdecomp==0.2.18",
  "timm>=0.9.16,<2",
  "fastai==2.7.15",
  "fastcore==1.5.55",
  "spacy==3.7.5",
  "thinc==8.2.5",
  "dask==2024.4.2",
  "distributed==2024.4.2",
  "dask-ml==2024.4.4",
  "pymonad==2.4.0",
  "PyYAML>=6,<7",
  "schema==0.7.7",
  "typing-extensions>=4.8",
  "tqdm>=4.65,<5",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
experiments = ["optuna==4.9.0", "matplotlib>=3.8,<4"]
test = ["pytest==8.4.2", "pytest-cov>=5,<6", "hypothesis==6.112.0", "build>=1.2,<2", "setuptools>=68,<81", "wheel>=0.43,<1"]
llm = ["transformers==4.44.2", "accelerate==0.34.2", "datasets==2.20.0", "evaluate==0.4.6", "sentencepiece>=0.2,<1"]
gpu = ["bitsandbytes>=0.43,<1; platform_system == 'Linux'", "nvidia-ml-py>=12,<14"]
export = ["onnx==1.16.2", "onnxruntime==1.18.1", "onnxruntime-extensions>=0.11,<0.13"]
service = ["Flask>=3,<4", "flask-cors>=4,<6", "flask-socketio>=5,<6", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20"]
vision = ["segmentation-models-pytorch>=0.3,<0.4", "pycocotools>=2.0.7,<3", "opendatasets==0.1.22"]
docs = ["sphinx>=5,<8", "sphinx-rtd-theme>=1,<3", "autodocsumm>=0.2,<0.3"]

[project.urls]
Homepage = "https://github.com/v1docq/FedCore"

[tool.setuptools.dynamic]
version = { attr = "fedcore.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["fedcore*", "external*", "external_runtime*", "model_exporter*"]
exclude = ["tests*", "examples*", "build*", "dist*"]
namespaces = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"fedcore.repository.data" = ["*.json"]
"model_exporter" = ["templates/*.html", "static/js/*.js", "static/css/*.css", "device_architectures/*.json"]
