version: '3.8'

services:
  model-exporter:
    build: .
    container_name: model-exporter-app
    ports:
      - "5000:5000"
    volumes:
      - ./device_architectures:/app/device_architectures
      - ./templates:/app/templates
      - ./results:/app/results
      - ./static:/app/static
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - model-network

networks:
  model-network:
    driver: bridge
