services:
  model-exporter:
    build:
      context: ..
      dockerfile: model_exporter/Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./results:/app/results
    environment:
      FEDCORE_API_TOKEN: ${FEDCORE_API_TOKEN:?Set a long random FEDCORE_API_TOKEN}
    restart: unless-stopped
